services:
  dnd-form:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: dnd-form-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
    volumes:
      - app-uploads:/app/storage/uploads

  migrate:
    image: ${IMAGE_NAME}:migrator-${IMAGE_TAG}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    profiles:
      - tools

volumes:
  app-uploads:
    driver: local
